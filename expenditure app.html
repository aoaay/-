<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時個人收支記錄器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        stationery: '#3b82f6', // 文具 - 藍色
                        play: '#8b5cf6',       // 玩 - 紫色
                        mask: '#f59e0b',       // 面具 - 琥珀黃
                        other: '#6b7280'       // 其他 - 灰色
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl shadow-md shadow-indigo-200">
                    <i class="fa-solid fa-wallet"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-800 tracking-tight">即時收支記錄器</h1>
                    <p class="text-xs text-slate-500">清晰掌握每一筆文具、娛樂與生活開銷</p>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="flex items-center gap-2">
                <button onclick="exportData()" class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition duration-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-download"></i> 匯出備份
                </button>
                <label class="px-3 py-1.5 text-xs font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg transition duration-200 cursor-pointer flex items-center gap-1.5">
                    <i class="fa-solid fa-upload"></i> 匯入備份
                    <input type="file" id="importFileInput" onchange="importData(event)" class="hidden" accept=".json">
                </label>
                <button onclick="confirmReset()" class="px-3 py-1.5 text-xs font-medium bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-lg transition duration-200 flex items-center gap-1.5">
                    <i class="fa-solid fa-trash-can"></i> 清空資料
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 pt-6">

        <!-- Summary Cards / Real-time Balance -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <!-- Balance Card -->
            <div class="bg-gradient-to-br from-indigo-600 to-violet-700 rounded-2xl p-5 text-white shadow-lg shadow-indigo-100 relative overflow-hidden">
                <div class="absolute -right-4 -bottom-4 opacity-10 text-8xl">
                    <i class="fa-solid fa-scale-balanced"></i>
                </div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-medium uppercase tracking-wider text-indigo-200">即時差額 (當前結餘)</span>
                    <span class="bg-indigo-500/30 text-indigo-100 text-xs px-2.5 py-0.5 rounded-full border border-indigo-400/30" id="balanceStatus">微盈</span>
                </div>
                <div class="text-3xl font-extrabold tracking-tight mb-1" id="totalBalance">$ 0</div>
                <p class="text-xs text-indigo-200">收入減去所有支出的即時總結餘</p>
            </div>

            <!-- Total Income Card -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <span class="text-xs font-medium text-slate-400 uppercase tracking-wider block mb-1">總收入</span>
                    <div class="text-2xl font-bold text-emerald-600" id="totalIncome">$ 0</div>
                    <span class="text-xs text-slate-400 mt-1 inline-block" id="incomeCount">共 0 筆收入</span>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-arrow-trend-up"></i>
                </div>
            </div>

            <!-- Total Expense Card -->
            <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <span class="text-xs font-medium text-slate-400 uppercase tracking-wider block mb-1">總支出</span>
                    <div class="text-2xl font-bold text-rose-600" id="totalExpense">$ 0</div>
                    <span class="text-xs text-slate-400 mt-1 inline-block" id="expenseCount">共 0 筆支出</span>
                </div>
                <div class="w-12 h-12 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-arrow-trend-down"></i>
                </div>
            </div>
        </div>

        <!-- MAIN LAYOUT GRID -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- Left Column: Add Transaction Form & Category Progress -->
            <div class="lg:col-span-5 space-y-6">
                
                <!-- Add Transaction Form -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                    <h2 class="text-base font-bold text-slate-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-circle-plus text-indigo-600"></i> 新增帳務記錄
                    </h2>

                    <form id="transactionForm" onsubmit="handleAddTransaction(event)" class="space-y-4">
                        <!-- Type Switcher -->
                        <div>
                            <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">收支類型</label>
                            <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-xl">
                                <button type="button" id="btnTypeExpense" onclick="setTransactionType('expense')" 
                                        class="py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-rose-600 shadow-sm">
                                    <i class="fa-solid fa-minus-circle mr-1"></i> 支出
                                </button>
                                <button type="button" id="btnTypeIncome" onclick="setTransactionType('income')" 
                                        class="py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800">
                                    <i class="fa-solid fa-plus-circle mr-1"></i> 收入
                                </button>
                            </div>
                        </div>

                        <!-- Amount -->
                        <div>
                            <label for="amount" class="block text-xs font-semibold text-slate-500 uppercase mb-1">金額 (NTD / HKD)</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400 font-bold">$</span>
                                <input type="number" id="amount" required min="1" step="any" placeholder="0" 
                                       class="w-full pl-8 pr-4 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-lg font-bold text-slate-800">
                            </div>
                        </div>

                        <!-- Category Selector (Dynamic) -->
                        <div>
                            <label for="category" class="block text-xs font-semibold text-slate-500 uppercase mb-1">分類項</label>
                            <select id="category" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-sm bg-white text-slate-700">
                                <!-- Options rendered via JS dynamically -->
                            </select>
                        </div>

                        <!-- Date -->
                        <div>
                            <label for="date" class="block text-xs font-semibold text-slate-500 uppercase mb-1">日期</label>
                            <input type="date" id="date" required 
                                   class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-sm text-slate-700">
                        </div>

                        <!-- Description/Note -->
                        <div>
                            <label for="note" class="block text-xs font-semibold text-slate-500 uppercase mb-1">備註說明 (選填)</label>
                            <input type="text" id="note" placeholder="例如: 買原子筆、電影票、道具面具..." 
                                   class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition text-sm text-slate-700">
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold rounded-xl transition duration-200 shadow-md shadow-indigo-100 flex items-center justify-center gap-2 text-sm">
                            <i class="fa-solid fa-check"></i> 儲存記錄
                        </button>
                    </form>
                </div>

                <!-- 4 Major Expense Categories Breakdown -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-chart-pie text-indigo-600"></i> 四項支出分類統計
                        </h2>
                        <span class="text-xs text-slate-400">即時佔比</span>
                    </div>

                    <div id="categoryStatsList" class="space-y-4">
                        <!-- Rendered by JS -->
                    </div>
                </div>

            </div>

            <!-- Right Column: Visual Chart & History List -->
            <div class="lg:col-span-7 space-y-6">

                <!-- Chart Container -->
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                            <i class="fa-solid fa-chart-donut text-indigo-600"></i> 支出比例與分析圖表
                        </h2>
                        <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-md">四項支出分析</span>
                    </div>
                    
                    <div class="relative flex justify-center items-center h-64">
                        <canvas id="expenseChart"></canvas>
                        <div id="emptyChartMsg" class="hidden absolute text-slate-400 text-xs text-center">
                            <i class="fa-solid fa-chart-simple text-3xl mb-2 block"></i>
                            暫無支出數據，請新增帳務記錄
                        </div>
                    </div>
                </div>

                <!-- Transaction List Card -->
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="p-5 border-b border-slate-100 flex flex-wrap justify-between items-center gap-3">
                        <div>
                            <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                                <i class="fa-solid fa-list-check text-indigo-600"></i> 收支交易明細
                            </h2>
                            <p class="text-xs text-slate-400">可搜尋或依分類篩選歷史記錄</p>
                        </div>

                        <!-- Filters -->
                        <div class="flex items-center gap-2">
                            <!-- Category Filter Dropdown -->
                            <select id="filterCategory" onchange="renderHistoryList()" class="px-3 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-600 bg-slate-50 focus:outline-none focus:border-indigo-500">
                                <option value="ALL">全部分類</option>
                                <option value="文具">✏️ 文具</option>
                                <option value="玩">🎮 玩</option>
                                <option value="面具">🎭 面具</option>
                                <option value="其他">📦 其他</option>
                                <option value="收入">💵 收入項目</option>
                            </select>

                            <!-- Search Input -->
                            <div class="relative">
                                <input type="text" id="searchInput" oninput="renderHistoryList()" placeholder="搜尋備註..." 
                                       class="pl-8 pr-3 py-1.5 rounded-lg border border-slate-200 text-xs text-slate-600 bg-slate-50 focus:outline-none focus:border-indigo-500 w-36 sm:w-44">
                                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-400 text-xs"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Transactions Table / List -->
                    <div class="max-h-[420px] overflow-y-auto custom-scrollbar divide-y divide-slate-100" id="transactionList">
                        <!-- Transactions dynamically inserted here -->
                    </div>

                    <!-- Table Footer Summary -->
                    <div class="bg-slate-50 p-3 px-5 border-t border-slate-100 flex justify-between items-center text-xs text-slate-500">
                        <span id="filteredCount">顯示 0 筆記錄</span>
                        <span id="filteredTotalSum">篩選小計: $0</span>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Custom Toast Message Notification -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 z-50 pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toastText" class="text-sm font-medium">記錄已成功新增！</span>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform duration-200" id="confirmModalCard">
            <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-xl mb-4 mx-auto">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800 text-center mb-1" id="modalTitle">確認重置所有資料？</h3>
            <p class="text-xs text-slate-500 text-center mb-6" id="modalDesc">此操作將清除所有收支記錄且無法復原，請確認是否繼續。</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl transition">
                    取消
                </button>
                <button id="modalConfirmBtn" onclick="executeResetData()" class="flex-1 py-2.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl transition shadow-md shadow-rose-200">
                    確認清除
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data Categories Definition
        const EXPENSE_CATEGORIES = [
            { name: '文具', icon: 'fa-pencil', color: '#3b82f6', bgClass: 'bg-blue-50', textClass: 'text-blue-600' },
            { name: '玩', icon: 'fa-gamepad', color: '#8b5cf6', bgClass: 'bg-purple-50', textClass: 'text-purple-600' },
            { name: '面具', icon: 'fa-masks-theater', color: '#f59e0b', bgClass: 'bg-amber-50', textClass: 'text-amber-600' },
            { name: '其他', icon: 'fa-box', color: '#6b7280', bgClass: 'bg-slate-100', textClass: 'text-slate-600' }
        ];

        const INCOME_CATEGORIES = [
            { name: '零用錢', icon: 'fa-hand-holding-dollar', color: '#10b981' },
            { name: '薪水/兼職', icon: 'fa-briefcase', color: '#059669' },
            { name: '其他收入', icon: 'fa-coins', color: '#0d9488' }
        ];

        // App State
        let transactions = [];
        let currentType = 'expense'; // 'expense' or 'income'
        let expenseChart = null;

        window.onload = function() {
            // Set default date input to today
            document.getElementById('date').valueAsDate = new Date();
            
            // Load saved state
            loadFromLocalStorage();

            // Populate Category Select Dropdown
            updateCategoryOptions();

            // Initialize Chart
            initChart();

            // Render UI
            renderAll();
        };

        // Switch between Expense and Income modes
        function setTransactionType(type) {
            currentType = type;
            const btnExpense = document.getElementById('btnTypeExpense');
            const btnIncome = document.getElementById('btnTypeIncome');

            if (type === 'expense') {
                btnExpense.className = "py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-rose-600 shadow-sm";
                btnIncome.className = "py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800";
            } else {
                btnIncome.className = "py-2 text-sm font-semibold rounded-lg transition-all duration-200 bg-white text-emerald-600 shadow-sm";
                btnExpense.className = "py-2 text-sm font-semibold rounded-lg transition-all duration-200 text-slate-500 hover:text-slate-800";
            }

            updateCategoryOptions();
        }

        // Dynamically update dropdown options based on currentType
        function updateCategoryOptions() {
            const select = document.getElementById('category');
            select.innerHTML = '';

            const categories = currentType === 'expense' ? EXPENSE_CATEGORIES : INCOME_CATEGORIES;

            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.name;
                opt.textContent = `${cat.name}`;
                select.appendChild(opt);
            });
        }

        // Add new Transaction item
        function handleAddTransaction(e) {
            e.preventDefault();

            const amountInput = document.getElementById('amount');
            const categorySelect = document.getElementById('category');
            const dateInput = document.getElementById('date');
            const noteInput = document.getElementById('note');

            const amount = parseFloat(amountInput.value);
            if (isNaN(amount) || amount <= 0) {
                showToast('請輸入有效的金額！', 'error');
                return;
            }

            const newTx = {
                id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                type: currentType,
                amount: amount,
                category: categorySelect.value,
                date: dateInput.value,
                note: noteInput.value.trim() || (currentType === 'expense' ? `${categorySelect.value}支出` : '收入')
            };

            transactions.unshift(newTx); // Add to beginning
            saveToLocalStorage();
            renderAll();

            // Reset Form fields
            amountInput.value = '';
            noteInput.value = '';
            amountInput.focus();

            showToast(currentType === 'expense' ? '已記錄一筆支出！' : '已記錄一筆收入！', 'success');
        }

        // Recalculate totals and render everything
        function renderAll() {
            renderDashboardCards();
            renderCategoryBreakdown();
            renderHistoryList();
            updateChart();
        }

        // Render Balance, Total Income, Total Expense Cards
        function renderDashboardCards() {
            let incomeTotal = 0;
            let expenseTotal = 0;
            let incomeCnt = 0;
            let expenseCnt = 0;

            transactions.forEach(t => {
                if (t.type === 'income') {
                    incomeTotal += t.amount;
                    incomeCnt++;
                } else {
                    expenseTotal += t.amount;
                    expenseCnt++;
                }
            });

            const netBalance = incomeTotal - expenseTotal;

            // Update DOM Elements
            document.getElementById('totalIncome').innerText = `$ ${incomeTotal.toLocaleString()}`;
            document.getElementById('totalExpense').innerText = `$ ${expenseTotal.toLocaleString()}`;
            document.getElementById('totalBalance').innerText = `$ ${netBalance.toLocaleString()}`;

            document.getElementById('incomeCount').innerText = `共 ${incomeCnt} 筆收入`;
            document.getElementById('expenseCount').innerText = `共 ${expenseCnt} 筆支出`;

            // Update Status Badge text & styles based on balance
            const badge = document.getElementById('balanceStatus');
            if (netBalance > 0) {
                badge.innerText = '盈餘中';
                badge.className = 'bg-emerald-500/20 text-emerald-100 text-xs px-2.5 py-0.5 rounded-full border border-emerald-400/30';
            } else if (netBalance === 0) {
                badge.innerText = '收支平衡';
                badge.className = 'bg-indigo-500/30 text-indigo-100 text-xs px-2.5 py-0.5 rounded-full border border-indigo-400/30';
            } else {
                badge.innerText = '超支透支';
                badge.className = 'bg-rose-500/30 text-rose-200 text-xs px-2.5 py-0.5 rounded-full border border-rose-400/30';
            }
        }

        // Render progress bars for the 4 explicit expense categories: 文具, 玩, 面具, 其他
        function renderCategoryBreakdown() {
            const container = document.getElementById('categoryStatsList');
            container.innerHTML = '';

            // Calculate total expenses for percentage base
            const totalExpenseSum = transactions
                .filter(t => t.type === 'expense')
                .reduce((sum, t) => sum + t.amount, 0);

            EXPENSE_CATEGORIES.forEach(cat => {
                const catSum = transactions
                    .filter(t => t.type === 'expense' && t.category === cat.name)
                    .reduce((sum, t) => sum + t.amount, 0);

                const percentage = totalExpenseSum > 0 ? ((catSum / totalExpenseSum) * 100).toFixed(1) : 0;

                const itemHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-1 text-xs">
                            <span class="font-semibold text-slate-700 flex items-center gap-1.5">
                                <span class="w-6 h-6 rounded-md ${cat.bgClass} ${cat.textClass} flex items-center justify-center text-xs">
                                    <i class="fa-solid ${cat.icon}"></i>
                                </span>
                                ${cat.name}
                            </span>
                            <div class="text-right">
                                <span class="font-bold text-slate-800">$ ${catSum.toLocaleString()}</span>
                                <span class="text-slate-400 ml-1">(${percentage}%)</span>
                            </div>
                        </div>
                        <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                            <div class="h-full rounded-full transition-all duration-500" 
                                 style="width: ${percentage}%; background-color: ${cat.color};"></div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        // Render transaction history list with filtering and search
        function renderHistoryList() {
            const container = document.getElementById('transactionList');
            const filterCategory = document.getElementById('filterCategory').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();

            container.innerHTML = '';

            let filtered = transactions.filter(t => {
                // Category Filter
                if (filterCategory !== 'ALL') {
                    if (filterCategory === '收入') {
                        if (t.type !== 'income') return false;
                    } else {
                        if (t.category !== filterCategory) return false;
                    }
                }

                // Search Query Filter
                if (searchQuery) {
                    const matchNote = t.note.toLowerCase().includes(searchQuery);
                    const matchCategory = t.category.toLowerCase().includes(searchQuery);
                    const matchAmount = t.amount.toString().includes(searchQuery);
                    return matchNote || matchCategory || matchAmount;
                }

                return true;
            });

            // Update Counts in table footer
            document.getElementById('filteredCount').innerText = `顯示 ${filtered.length} 筆記錄`;
            const filterSum = filtered.reduce((acc, cur) => cur.type === 'income' ? acc + cur.amount : acc - cur.amount, 0);
            const sumFormatted = filterSum >= 0 ? `+$${filterSum.toLocaleString()}` : `-$${Math.abs(filterSum).toLocaleString()}`;
            document.getElementById('filteredTotalSum').innerText = `淨計: ${sumFormatted}`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="p-8 text-center text-slate-400 text-xs">
                        <i class="fa-regular fa-folder-open text-3xl mb-2 block text-slate-300"></i>
                        沒有找到符合條件的帳務記錄
                    </div>
                `;
                return;
            }

            filtered.forEach(t => {
                const isExpense = t.type === 'expense';
                let iconClass = 'fa-coins';
                let bgClass = 'bg-emerald-50 text-emerald-600';

                if (isExpense) {
                    const foundCat = EXPENSE_CATEGORIES.find(c => c.name === t.category);
                    if (foundCat) {
                        iconClass = foundCat.icon;
                        bgClass = `${foundCat.bgClass} ${foundCat.textClass}`;
                    } else {
                        iconClass = 'fa-box';
                        bgClass = 'bg-slate-100 text-slate-600';
                    }
                }

                const row = document.createElement('div');
                row.className = 'p-3.5 px-5 hover:bg-slate-50 transition flex items-center justify-between group';
                row.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-xl ${bgClass} flex items-center justify-center text-sm font-bold flex-shrink-0">
                            <i class="fa-solid ${iconClass}"></i>
                        </div>
                        <div>
                            <div class="text-sm font-semibold text-slate-800 flex items-center gap-2">
                                <span>${t.note}</span>
                                <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-normal">${t.category}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 mt-0.5">${t.date}</div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="text-right">
                            <div class="text-sm font-extrabold ${isExpense ? 'text-rose-600' : 'text-emerald-600'}">
                                ${isExpense ? '-' : '+'}$${t.amount.toLocaleString()}
                            </div>
                        </div>
                        <button onclick="deleteTransaction('${t.id}')" 
                                class="text-slate-300 hover:text-rose-500 p-1.5 rounded-lg hover:bg-rose-50 transition opacity-0 group-hover:opacity-100" title="刪除此筆記錄">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // Delete a single transaction
        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveToLocalStorage();
            renderAll();
            showToast('已成功刪除該筆帳務', 'info');
        }

        function initChart() {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            expenseChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: EXPENSE_CATEGORIES.map(c => c.name),
                    datasets: [{
                        data: [0, 0, 0, 0],
                        backgroundColor: EXPENSE_CATEGORIES.map(c => c.color),
                        borderWidth: 2,
                        borderColor: '#ffffff',
                        hoverOffset: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                font: { family: "'Noto Sans TC', sans-serif", size: 12 },
                                padding: 15,
                                usePointStyle: true,
                                pointStyle: 'circle'
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const val = context.raw || 0;
                                    return ` ${context.label}: $${val.toLocaleString()}`;
                                }
                            }
                        }
                    },
                    cutout: '65%'
                }
            });
        }

        // Update Chart with current expense numbers
        function updateChart() {
            if (!expenseChart) return;

            const categoryData = EXPENSE_CATEGORIES.map(cat => {
                return transactions
                    .filter(t => t.type === 'expense' && t.category === cat.name)
                    .reduce((sum, t) => sum + t.amount, 0);
            });

            const totalSum = categoryData.reduce((a, b) => a + b, 0);
            const emptyMsg = document.getElementById('emptyChartMsg');

            if (totalSum === 0) {
                emptyMsg.classList.remove('hidden');
                expenseChart.data.datasets[0].data = [1, 1, 1, 1]; // Placeholder array
                expenseChart.data.datasets[0].backgroundColor = ['#f1f5f9', '#f1f5f9', '#f1f5f9', '#f1f5f9'];
            } else {
                emptyMsg.classList.add('hidden');
                expenseChart.data.datasets[0].data = categoryData;
                expenseChart.data.datasets[0].backgroundColor = EXPENSE_CATEGORIES.map(c => c.color);
            }

            expenseChart.update();
        }

        // LocalStorage Helpers
        function saveToLocalStorage() {
            try {
                localStorage.setItem('my_expense_tracker_data', JSON.stringify(transactions));
            } catch (e) {
                console.error("Failed to save to localStorage", e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem('my_expense_tracker_data');
                if (saved) {
                    transactions = JSON.parse(saved);
                } else {
                    // Seed initial demo data for quick preview
                    transactions = [
                        { id: '1', type: 'income', amount: 5000, category: '零用錢', date: getTodayStr(), note: '本月發發發零用錢' },
                        { id: '2', type: 'expense', amount: 350, category: '文具', date: getTodayStr(), note: '買日本鋼筆與筆記本' },
                        { id: '3', type: 'expense', amount: 800, category: '玩', date: getTodayStr(), note: '夾娃娃機與密室逃脫' },
                        { id: '4', type: 'expense', amount: 1200, category: '面具', date: getTodayStr(), note: '萬聖節派對面具' },
                        { id: '5', type: 'expense', amount: 150, category: '其他', date: getTodayStr(), note: '便利商店零食' }
                    ];
                    saveToLocalStorage();
                }
            } catch (e) {
                transactions = [];
            }
        }

        function getTodayStr() {
            const d = new Date();
            return d.toISOString().split('T')[0];
        }

        // Export Data to JSON File
        function exportData() {
            if (transactions.length === 0) {
                showToast('目前沒有帳務資料可匯出', 'info');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `收支記錄備份_${getTodayStr()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('備份 JSON 檔案已下載！', 'success');
        }

        // Import Data from JSON File
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        transactions = imported;
                        saveToLocalStorage();
                        renderAll();
                        showToast('成功匯入歷史記錄！', 'success');
                    } else {
                        showToast('匯入檔案格式不符', 'error');
                    }
                } catch (err) {
                    showToast('解析 JSON 檔案失敗', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset input
        }

        // Modal for Confirmation (Replacing native alert/confirm)
        function confirmReset() {
            const modal = document.getElementById('confirmModal');
            const card = document.getElementById('confirmModalCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                card.classList.add('scale-100');
            }, 10);
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirmModal');
            const card = document.getElementById('confirmModalCard');
            modal.classList.add('opacity-0');
            card.classList.remove('scale-100');
            card.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        function executeResetData() {
            transactions = [];
            saveToLocalStorage();
            renderAll();
            closeConfirmModal();
            showToast('所有記錄已清空！', 'info');
        }

        // Custom Toast Notification System
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toastText');
            const toastIcon = document.getElementById('toastIcon');

            toastText.innerText = message;

            if (type === 'success') {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
            } else if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400 text-lg';
            } else {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400 text-lg';
            }

            // Show Toast
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            // Hide Toast after 2.5 seconds
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
